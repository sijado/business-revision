async function initRuntime(){
  if(!window.claude||!window.claude.use) return;
  claude.use("sample").then(async s=>{SAMPLE=s;if(s){try{LIMITS=await s.limits()}catch(e){LIMITS=null}} if(view.name==="import")render()});
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    DB=db; UID=uid; docRef=db.doc("data/users/"+uid+"/progress");
    setSync("busy","Syncing…");
    const snap=await docRef.get();
    if(snap.exists){P=merge(P,snap.data());persistLocal()}
    dirty=true; await flush();
    // packs: union of remote + local-only
    try{
      const qs=await packsCol().get();
      const all=qs.docs.filter(d=>d.id.startsWith("pack-"));
      for(const d of all){if(P.gone[d.id]){try{await packsCol().doc(d.id).delete()}catch(e){}}}
      const remote=all.filter(d=>!P.gone[d.id]).map(d=>d.data());
      const ids=new Set(remote.map(p=>p.id));
      const localOnly=PACKS.filter(p=>!ids.has(p.id));
      for(const p of localOnly){try{await packsCol().doc(p.id).set(p)}catch(e){}}
      PACKS=[...remote.map(p=>JSON.parse(JSON.stringify(p))),...localOnly]; persistPacks();
    }catch(e){}
    docRef.onSnapshot(s=>{
      if(!s.exists||s.metadata.hasPendingWrites) return;
      const d=s.data(); if((d.updated||0)<=P.updated) return;
      P=merge(P,d); persistLocal(); PACKS=PACKS.filter(p=>!P.gone[p.id]); persistPacks(); setSync("on","Synced to your account"); updateTop();
      if(view.name==="home") render();
    },()=>setSync("","Not synced — saved on this device"));
    updateTop(); if(view.name==="home"||view.name==="unit") render();
  }catch(e){docRef=null;setSync("","Saved on this device only")}

function customUnit(p){return {id:p.id,code:"MY SLIDES",title:p.title,assess:"Imported slides",exam:false,course:COURSE[p.courseId]||COURSES[0],notes:[],cards:[],quiz:[],exam:[],custom:p}}
function isTopic(p){return !p.unitId||(!BASE[p.unitId]&&!PACKS.some(x=>x.id===p.unitId))}
function unitsOf(c){return [...c.units,...PACKS.filter(p=>isTopic(p)&&p.courseId===c.id).map(customUnit)]}
function allUnits(){return COURSES.flatMap(unitsOf)}
function getUnit(id){if(BASE[id])return BASE[id];const p=PACKS.find(x=>x.id===id&&isTopic(x));return p?customUnit(p):null}
function sources(u){
  const list=[]; if(!u.custom) list.push({id:u.id,notes:u.notes,cards:u.cards,quiz:u.quiz,exam:u.exam});
  (u.custom?[u.custom,...PACKS.filter(p=>p.unitId===u.id)]:PACKS.filter(p=>p.unitId===u.id)).forEach(p=>list.push({id:p.id,pack:p,notes:p.notes||[],cards:p.cards||[],quiz:p.quiz||[],exam:p.exam||[]}));
  return list;
}
function cardsOf(u){const out=[];sources(u).forEach(s=>s.cards.forEach((c,i)=>out.push({k:s.id+":"+i,f:c[0],b:c[1],u,pack:s.pack})));return out}
function quizOf(u){return sources(u).flatMap(s=>s.quiz)}
function examOf(u){const out=[];sources(u).forEach(s=>s.exam.forEach((e,i)=>out.push(Object.assign({},e,{k:s.id+":"+i,pack:s.pack}))));return out}

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b class="kt">$1</b>').replace(/`([^`]+)`/g,"<code>$1</code>")}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function isDue(k){const r=P.cards[k];return !r||r.d<=Date.now()}
function unitStats(u){
  const cs=cardsOf(u);let mastered=0,due=0;
  cs.forEach(c=>{const r=P.cards[c.k];if(r&&r.b>=3)mastered++;if(isDue(c.k))due++});
  return {mastered,due,total:cs.length,pct:cs.length?Math.round(mastered/cs.length*100):0,quiz:P.quiz[u.id]};
}
function allDue(){return allUnits().flatMap(u=>cardsOf(u).filter(c=>isDue(c.k)))}
function dayKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addXP(n){if(!n)return;const k=dayKey();P.days[k]=(P.days[k]||0)+n;toast("+"+n+" XP")}
function totalXP(){return Object.values(P.days).reduce((a,b)=>a+b,0)}
function streak(){let n=0;const d=new Date();if(!P.days[dayKey(d)])d.setDate(d.getDate()-1);while(P.days[dayKey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function levelInfo(){const x=totalXP(),L=Math.floor(Math.sqrt(x/25))+1,lo=25*(L-1)**2,hi=25*L*L;return {x,L,toNext:hi-x,pct:Math.round((x-lo)/(hi-lo)*100)}}
function updateTop(){const li=levelInfo();$("#streakPill").textContent="🔥 "+streak();$("#xpPill").textContent="⚡ Lv "+li.L}
let toastT;function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1100)}
function rateCard(c,ok){
  const r=P.cards[c.k]||{b:0},b=ok?Math.min((r.b||0)+1,5):0;
  P.cards[c.k]={b,d:Date.now()+(ok?GAPS[b]*DAY:0),t:Date.now()};
  addXP(ok?2:1); save();
}
function setC(u){document.documentElement.style.setProperty("--c",`var(${u.course.color})`)}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.createElement("canvas");cv.id="confetti";document.body.appendChild(cv);
  const ctx=cv.getContext("2d"),W=cv.width=innerWidth,H=cv.height=innerHeight,cs=getComputedStyle(document.documentElement);
  const cols=["--it","--biz","--soton","--gold","--hot"].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:110},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});
    if(++t<90)requestAnimationFrame(f);else cv.remove()})();
}

async function handleFiles(files){

async function readPptx(file){
  if(!window.JSZip) throw new Error("no zip");
  const zip=await JSZip.loadAsync(file);
  const A="http://schemas.openxmlformats.org/drawingml/2006/main";
  const txt=xml=>{const d=new DOMParser().parseFromString(xml,"application/xml");return [...d.getElementsByTagNameNS(A,"p")].map(p=>[...p.getElementsByTagNameNS(A,"t")].map(t=>t.textContent).join("")).filter(s=>s.trim()).join("\n")};
  const num=n=>+n.match(/(\d+)\.xml$/)[1];
  const slides=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>num(a)-num(b));
  const out=[];
  for(const n of slides){
    const i=num(n); let notes="";
    const rels=zip.file(`ppt/slides/_rels/slide${i}.xml.rels`);
    if(rels){const m=(await rels.async("string")).match(/Target="\.\.\/notesSlides\/(notesSlide\d+\.xml)"/);
      if(m&&zip.file("ppt/notesSlides/"+m[1]))notes=txt(await zip.file("ppt/notesSlides/"+m[1]).async("string")).split("\n").filter(l=>!/^\d+$/.test(l.trim())).join(" ")}
    const t=txt(await zip.file(n).async("string"));
    if(t||notes) out.push(`--- Slide ${i} ---\n${t}${notes?`\n[Speaker notes] ${notes}`:""}`);
  }
  if(!out.length) throw new Error("empty");
  return out.join("\n\n");
}
function buildPrompt(){
  const t=imp.target, isNew=t.startsWith("new:"), course=isNew?COURSE[t.slice(4)]:getUnit(t).course, u=isNew?null:getUnit(t);
  return `You are turning a student's lesson slides into condensed revision material.
Student: UK sixth-form student doing ${course.full}. Topic: ${u?u.code+" "+u.title:(imp.newName||"(work it out from the slides)")}.
Goal: make the content quick and easy to learn. Compress hard: cut filler, repetition, titles and admin, but keep every examinable fact, definition, formula, process and example. Use short, plain sentences.
${imp.images.length?`${imp.images.length} slide image(s) are attached: read all text, diagrams and tables in them.\n`:""}Reply with ONLY one JSON object in exactly this shape:
{"title":"short topic title, max 6 words",
 "summary":"one-sentence TL;DR of the whole deck",
 "notes":[{"h":"section heading","b":["bullet","bullet"]}],
 "cards":[["front: a term or short question","back: answer in max 25 words"]],
 "quiz":[{"q":"question","options":["A","B","C","D"],"answer":0,"why":"one-sentence explanation"}],
 "exam":[{"q":"exam-style question","marks":4,"cmd":"Explain","points":["mark scheme point"]}]}
Rules: 3-7 note sections with 2-6 bullets each, each bullet max 30 words; wrap key terms in **double asterisks**; a bullet that is only a formula starts with "= ". 8-20 cards. 5-10 quiz questions with exactly 4 options, "answer" is the 0-based index of the correct option, wrong options must be plausible. 2-3 exam questions using BTEC command words (Describe, Explain, Analyse, Assess, Evaluate, Justify, Calculate) with 2-9 marks and one point per mark. Use only information from the slides; you may add a brief example only where a slide is unclear.

SLIDES:
<<<
${slideText()||"(see attached images)"}
>>>`;
}
const ERR={not_granted:"Claude wasn't allowed for this page. Reload and choose Allow to use the importer.",rate_limited:"You've hit a usage limit. Try again in a little while.",prompt_too_large:"That's too much at once. Import the deck in two halves.",invalid_json:"Claude's answer came back in the wrong format. Press the button to try again.",image_rejected:"One of the images couldn't be read. Remove it or use a PNG/JPEG.",refused:"Claude couldn't process these slides. Try pasting the text instead.",session_expired:"You've been signed out. Sign in to claude.ai again.",sampling_disabled:"Claude isn't available for this account.",empty_completion:"Nothing came back. Try again with a bit less content."};
function clean(d){
  d=d&&typeof d==="object"?d:{};
  const s=x=>typeof x==="string"?x.trim():"";const arr=x=>Array.isArray(x)?x:[];
  const notes=arr(d.notes).map(n=>({h:s(n&&n.h)||"Notes",b:arr(n&&n.b).map(s).filter(Boolean)})).filter(n=>n.b.length);
  const cards=arr(d.cards).map(c=>Array.isArray(c)?[s(c[0]),s(c[1])]:[s(c&&c.front),s(c&&c.back)]).filter(c=>c[0]&&c[1]);
  const quiz=arr(d.quiz).map(q=>{const o=arr(q&&q.options).map(s).filter(Boolean),a=Number(q&&q.answer);return o.length>=2&&Number.isInteger(a)&&a>=0&&a<o.length&&s(q.q)?[s(q.q),o,a,s(q.why)]:null}).filter(Boolean);
  const exam=arr(d.exam).map(e=>({q:s(e&&e.q),m:Math.max(1,Math.min(20,Math.round(Number(e&&e.marks))||4)),cmd:s(e&&e.cmd)||"Explain",pts:arr(e&&e.points).map(s).filter(Boolean)})).filter(e=>e.q&&e.pts.length);
  return {title:(s(d.title)||"Imported slides").slice(0,60),summary:s(d.summary),notes,cards,quiz,exam};
}
async function generate(){
  if(!SAMPLE||imp.status==="working")return;
  imp.status="working";imp.msg="";imp.chars=0;imp.ctl=new AbortController();drawGen();
  const opts={signal:imp.ctl.signal,cache:false,onText:({text})=>{imp.chars=text.length;const sp=document.querySelector(".spinner span");if(sp)sp.textContent=`Writing your revision pack… ${imp.chars.toLocaleString()} characters`}};
  if(imp.images.length)opts.images=imp.images.map(m=>m.file);
  try{
    const r=clean(await SAMPLE.json(buildPrompt(),opts));
    if(!r.cards.length&&!r.notes.length)throw {code:"empty_completion"};
    if(imp.target.startsWith("new:")&&imp.newName.trim())r.title=imp.newName.trim().slice(0,60);
    imp.result=r;imp.status="done";
  }catch(e){imp.status="idle";imp.msg=e&&e.code==="cancelled"?"":(ERR[e&&e.code]||"Something went wrong reaching Claude. Try again.")}
  imp.ctl=null; if(view.name==="import")drawGen();
}
async function savePackFromImport(){
  const r=imp.result,t=imp.target,isNew=t.startsWith("new:");
  const p=Object.assign({id:"pack-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),created:Date.now(),
    unitId:isNew?null:t,courseId:isNew?t.slice(4):getUnit(t).course.id},r);
  PACKS.push(p);persistPacks();

  addXP(10);save();setTimeout(()=>toast("Saved · use Sync to send it to the offline app"),1200);
  imp.text="";imp.images=[];imp.pptx=[];imp.result=null;imp.status="idle";imp.newName="";
  go({name:"unit",id:p.unitId||p.id,tab:"notes"});

async function deletePack(id){
  // also remove packs attached to a custom topic being deleted
  const gone=PACKS.filter(p=>p.id===id||p.unitId===id).map(p=>p.id);
  PACKS=PACKS.filter(p=>!gone.includes(p.id));persistPacks();

/* ============ LIVE CLOUD SYNC (installed app, Firebase) ============ */
const FB_CFG=(!IN_CLAUDE&&window.DOGTAG_FIREBASE&&window.DOGTAG_FIREBASE.apiKey)?window.DOGTAG_FIREBASE:null;
const FB_OPTS=FB_CFG?Object.fromEntries(["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId","measurementId"].filter(k=>FB_CFG[k]).map(k=>[k,FB_CFG[k]])):null;
const CLOUD={state:FB_CFG?"loading":"off",user:null,db:null,auth:null,prog:null,packs:null,unsub:[],timer:null,err:"",firstPacks:true};
function canon(o){if(Array.isArray(o))return "["+o.map(canon).join(",")+"]";if(o&&typeof o==="object")return "{"+Object.keys(o).filter(k=>k!=="updated"&&o[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+canon(o[k])).join(",")+"}";return JSON.stringify(o)}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function cloudStatus(){
  if(IN_CLAUDE)return;
  const st=CLOUD.state,on=navigator.onLine;
  if(!FB_CFG){setSync("","Saved on this device. Live sync isn't set up yet");return}
  if(st==="signedout"){setSync("","Saved on this device. Sign in under Sync to turn on live sync");return}
  if(!on||st==="waiting"||st==="unavailable"){setSync("busy","Offline. Changes will sync when you're back online");return}
  if(st==="error"){setSync("","Live sync problem ("+CLOUD.err+"). Saved on this device");return}
  if(st==="on")setSync("on","Live sync on");else setSync("busy","Syncing…");
}
async function initCloud(){
  if(!FB_CFG||CLOUD.auth)return;
  try{
    const B="https://www.gstatic.com/firebasejs/10.12.2/";
    if(!window.firebase){await loadScript(B+"firebase-app-compat.js");await loadScript(B+"firebase-auth-compat.js");await loadScript(B+"firebase-firestore-compat.js")}
    if(!firebase.apps.length)firebase.initializeApp(FB_OPTS);
    CLOUD.auth=firebase.auth();CLOUD.db=firebase.firestore();
    CLOUD.auth.onAuthStateChanged(u=>{CLOUD.user=u;cloudDetach();if(u)cloudAttach();else CLOUD.state="signedout";cloudStatus();if(view.name==="sync")render()});
  }catch(e){CLOUD.state="unavailable";cloudStatus()}
}
function cloudDetach(){CLOUD.unsub.forEach(f=>{try{f()}catch(e){}});CLOUD.unsub=[];CLOUD.prog=null;CLOUD.packs=null;CLOUD.firstPacks=true}
function softRender(){updateTop();if(view.name==="home"||view.name==="sync"||(view.name==="unit"&&!view.sub&&view.tab!=="exam"))render()}
function cloudAttach(){
  const base=CLOUD.db.collection("users").doc(CLOUD.user.uid);
  CLOUD.prog=base.collection(APP.dataNs).doc("progress");CLOUD.packs=base.collection(APP.packsNs);
  CLOUD.state="syncing";cloudStatus();
  CLOUD.unsub.push(CLOUD.prog.onSnapshot({includeMetadataChanges:true},s=>{
    if(!s.metadata.hasPendingWrites){
      let remote=null;try{remote=s.exists&&s.data().json?JSON.parse(s.data().json):null}catch(e){}
      if(remote){const before=canon(P);P=merge(P,remote);if(canon(P)!==before){persistLocal();const n=PACKS.length;PACKS=PACKS.filter(p=>!P.gone[p.id]);if(PACKS.length!==n)persistPacks();softRender()}}
      if(!remote||canon(P)!==canon(remote))cloudQueue(400);
    }
    CLOUD.state=s.metadata.fromCache?"waiting":"on";cloudStatus();
  },e=>{CLOUD.state="error";CLOUD.err=e.code||"error";cloudStatus()}));
  CLOUD.unsub.push(CLOUD.packs.onSnapshot(qs=>{
    let changed=false;const have=new Set(PACKS.map(p=>p.id));
    qs.docChanges().forEach(ch=>{const id=ch.doc.id;
      if(ch.type==="removed"){if(!ch.doc.metadata.hasPendingWrites&&!qs.metadata.fromCache&&!P.gone[id]){P.gone[id]=Date.now();PACKS=PACKS.filter(p=>p.id!==id);changed=true;save()}}
      else if(P.gone[id]){ch.doc.ref.delete().catch(()=>{})}
      else if(!have.has(id)){try{PACKS.push(cleanStored(JSON.parse(ch.doc.data().json)));have.add(id);changed=true}catch(e){}}});
    if(CLOUD.firstPacks&&!qs.metadata.fromCache){CLOUD.firstPacks=false;
      const remote=new Set(qs.docs.map(d=>d.id));
      PACKS.filter(p=>!remote.has(p.id)&&!P.gone[p.id]).forEach(p=>CLOUD.packs.doc(p.id).set({json:JSON.stringify(p)}).catch(()=>{}))}
    if(changed){persistPacks();softRender()}
  },()=>{}));
}
function cloudQueue(delay=1200){
  if(!CLOUD.prog)return;clearTimeout(CLOUD.timer);
  CLOUD.timer=setTimeout(()=>{if(!CLOUD.prog)return;CLOUD.prog.set({json:JSON.stringify(P),updated:P.updated||Date.now()}).catch(e=>{CLOUD.state="error";CLOUD.err=e.code||"error";cloudStatus()})},delay);
}

    <p class="status">${CLOUD.state==="unavailable"?"Connect to the internet to sign in. The app still works offline.":"Sign in with the same email on your phone and PC. Your progress and slides then stay in step automatically."}</p>
    <label class="lbl">Email<input type="text" id="cEmail" inputmode="email" autocomplete="username" autocapitalize="off"></label>
    <label class="lbl">Password<input type="password" id="cPass" autocomplete="current-password" style="width:100%;background:var(--raised);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px"></label>
    <div class="row"><button class="btn" id="cIn" style="--c:var(--it)">Sign in</button><button class="btn ghost" id="cUp">Create account</button><span class="status" id="cMsg"></span></div></div>`;
  const lab={on:"✅ Live sync is on",waiting:"⏳ Offline. Changes will sync when you're back online",syncing:"🔄 Syncing…",error:"⚠️ Sync problem: "+CLOUD.err}[CLOUD.state]||"🔄 Syncing…";
  return `<div class="step"><h2><span class="num">☁</span>Live sync</h2><p><b>${lab}</b></p><p class="status">Signed in as ${esc(CLOUD.user.email||"")}. Progress, mistakes and slide packs update on every signed-in device as soon as it's online.</p>
    <div class="row"><button class="btn ghost small" id="cOut">Sign out</button></div></div>`;
}
function wireCloudSection(){
  const go=async up=>{const em=$("#cEmail").value.trim(),pw=$("#cPass").value,msg=$("#cMsg");msg.textContent=up?"Creating account…":"Signing in…";
    try{if(!CLOUD.auth)await initCloud();if(!CLOUD.auth)throw {code:"auth/network-request-failed"};
      if(up)await CLOUD.auth.createUserWithEmailAndPassword(em,pw);else await CLOUD.auth.signInWithEmailAndPassword(em,pw);toast("Live sync on")}
    catch(e){msg.textContent=AUTH_ERR[e&&e.code]||"Couldn't sign in ("+(e&&e.code||"error")+")."}};
  if($("#cIn"))$("#cIn").onclick=()=>go(false);
  if($("#cUp"))$("#cUp").onclick=()=>go(true);
  if($("#cOut"))$("#cOut").onclick=()=>CLOUD.auth&&CLOUD.auth.signOut();
}
addEventListener("online",()=>{if(FB_CFG&&!CLOUD.auth)initCloud();cloudStatus()});
addEventListener("offline",cloudStatus);

/* ============ SYNC CODES ============ */
const SYNC_PREFIX="DOGTAG1:";
function b64e(str){const by=new TextEncoder().encode(str);let bin="";for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin)}
function b64d(b){const bin=atob(b),by=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);return new TextDecoder().decode(by)}
function makeCode(){return SYNC_PREFIX+b64e(JSON.stringify({v:1,at:Date.now(),progress:P,packs:PACKS.filter(p=>!P.gone[p.id])}))}
function readCode(s){
  s=String(s||"").replace(/\s+/g,"");
  const i=s.indexOf(SYNC_PREFIX); if(i<0) throw new Error("prefix");
  const d=JSON.parse(b64d(s.slice(i+SYNC_PREFIX.length)));
  if(!d||d.v!==1||typeof d.progress!=="object") throw new Error("shape");
  return d;
}
function cleanStored(p){
  const s=x=>typeof x==="string"?x:"",arr=x=>Array.isArray(x)?x:[];
  return {id:p.id,created:+p.created||Date.now(),unitId:typeof p.unitId==="string"?p.unitId:null,courseId:COURSE[p.courseId]?p.courseId:"it",
    title:s(p.title).slice(0,60)||"Imported slides",summary:s(p.summary),
    notes:arr(p.notes).map(n=>({h:s(n&&n.h)||"Notes",b:arr(n&&n.b).map(s).filter(Boolean)})).filter(n=>n.b.length),
    cards:arr(p.cards).filter(c=>Array.isArray(c)&&s(c[0])&&s(c[1])).map(c=>[c[0],c[1]]),
    quiz:arr(p.quiz).filter(q=>Array.isArray(q)&&s(q[0])&&Array.isArray(q[1])&&q[1].length>=2&&Number.isInteger(q[2])&&q[2]>=0&&q[2]<q[1].length).map(q=>[q[0],q[1].map(String),q[2],s(q[3])]),
    exam:arr(p.exam).filter(e=>e&&s(e.q)&&Array.isArray(e.pts)).map(e=>({q:e.q,m:Math.max(1,Math.min(20,Math.round(+e.m)||4)),cmd:s(e.cmd)||"Explain",pts:e.pts.map(String)}))};
}
async function applyCode(d){
  P=merge(P,d.progress||{});
  const have=new Set(PACKS.map(p=>p.id)),added=[];
  (Array.isArray(d.packs)?d.packs:[]).forEach(p=>{
    if(p&&typeof p.id==="string"&&/^pack-[a-z0-9]+$/.test(p.id)&&!have.has(p.id)&&!P.gone[p.id]){const c=cleanStored(p);PACKS.push(c);have.add(c.id);added.push(c)}});
  PACKS=PACKS.filter(p=>!P.gone[p.id]);
  PACKS.forEach(p=>{if(p.unitId&&!BASE[p.unitId]&&!PACKS.some(x=>x.id===p.unitId&&!x.unitId))p.unitId=null});
  persistPacks(); save();
  const col=packsCol();
  if(col){for(const p of added){try{await col.doc(p.id).set(JSON.parse(JSON.stringify(p)))}catch(e){}}}
  return added.length;
}
function renderSync(){
  const n=PACKS.length;
  app.innerHTML=`<section class="imp-h"><div class="eyebrow">Sync</div><h1>${IN_CLAUDE?"Sync with the offline app":APP.slides?"Sync &amp; slides":"Sync"}</h1>
  <p>${IN_CLAUDE?"Send your progress and imported slides to the installed app, or bring progress from the app back here."
    :"Your progress is saved on this device. Live sync keeps your devices in step automatically; a sync code is the manual backup and brings in slides imported in the Claude version."}</p></section>
  ${cloudSection()}
  <div class="step"><h2><span class="num">1</span>Send from this ${IN_CLAUDE?"page":"device"}</h2>
    <p class="status">One code holding your progress${n?` and ${n} imported slide pack${n>1?"s":""}`:""}. Paste it on the other device.</p>
    <div class="row"><button class="btn" id="copyCode" style="--c:var(--it)">Copy sync code</button><span class="status" id="copyMsg"></span></div>
    <textarea id="codeOut" rows="4" readonly hidden></textarea></div>
  <div class="step"><h2><span class="num">2</span>Receive on this ${IN_CLAUDE?"page":"device"}</h2>
    <textarea id="codeIn" rows="4" placeholder="Paste a code that starts with DOGTAG1:"></textarea>
    <div class="row"><button class="btn" id="mergeBtn" style="--c:var(--soton)">Merge in</button><span class="status" id="mergeMsg"></span></div>
    <p class="status">Nothing gets wiped. Each card keeps its most recent result, quiz bests are kept, and new slide packs are added.</p></div>
  ${!IN_CLAUDE&&!APP.slides?"":`<div class="step"><h2><span class="num">3</span>${IN_CLAUDE?"Getting slides into the offline app":"Adding new slides"}</h2>
    <p class="status">${IN_CLAUDE?"Import slides on this page as usual, then come here, tap <b>Copy sync code</b>, open the offline app → <b>Sync &amp; slides</b> and paste it."
      :"Slide importing needs Claude, so do it in the Claude version of DOGTAG Revision (online). Then tap <b>Sync with the offline app</b> there, copy the code, and paste it above."}</p></div>`}`;
  wireCloudSection();
  $("#copyCode").onclick=()=>{
    const code=makeCode(),out=$("#codeOut"),msg=$("#copyMsg");
    const fallback=()=>{out.hidden=false;out.value=code;out.focus();out.select();msg.textContent="Copy the selected code"};
    try{navigator.clipboard.writeText(code).then(()=>{msg.textContent="Copied ✓ ("+Math.ceil(code.length/1024)+" KB)"},fallback)}catch(e){fallback()}
  };
  $("#mergeBtn").onclick=async()=>{
    const msg=$("#mergeMsg");
    let d;try{d=readCode($("#codeIn").value)}catch(e){msg.textContent="That doesn't look like a full sync code. Copy it again and paste the whole thing.";return}
    const added=await applyCode(d);
    $("#codeIn").value="";
    msg.textContent="Merged ✓"+(added?` · ${added} new slide pack${added>1?"s":""} added`:"");
    addXP(0);
  };
}

document.addEventListener("keydown",e=>{
  if(/TEXTAREA|INPUT|SELECT/.test(e.target.tagName))return;
  const card=$("#card");if(!card)return;
  if(e.key===" "){e.preventDefault();card.click()}
  else if(e.key==="1"&&$("#card.flipped"))$("#ag").click();
  else if(e.key==="2"&&$("#card.flipped"))$("#ok").click();
});

render();
initRuntime();
if(!IN_CLAUDE){cloudStatus();initCloud()}
</script>

</script>
