<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090C12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oliver's Revision">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.notch{position:fixed;inset:0 0 auto 0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:25}
</style>
<title>Oliver's Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: "arcade revision desk" — dotted desk background, chunky colour-coded course tiles with progress rings,
   unit pages open under a full-bleed course-colour banner; one bold move = course colour everywhere, neutrals stay quiet */
:root{
  --bg:#EEF1F7; --dot:#D4DAE6; --surface:#FFFFFF; --raised:#F6F8FC; --sunk:#E4E9F2;
  --ink:#0F131C; --muted:#5A6378; --line:#DCE2EC;
  --it:#2F55F5; --biz:#F06A12; --soton:#009E88; --gold:#E9A400; --hot:#F0384F;
  --good:#12A157; --bad:#E2363A; --key:#FFE27A; --keyink:#3D2C00;
  --onc:#FFFFFF; --banner-ink:#FFFFFF; --shadow:0 1px 2px rgb(16 24 40 / .06), 0 6px 18px rgb(16 24 40 / .07);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090C12; --dot:#182033; --surface:#121824; --raised:#17202F; --sunk:#1D2638;
  --ink:#EEF2F9; --muted:#98A3BA; --line:#253049;
  --it:#7290FF; --biz:#FF9A52; --soton:#2BD3B8; --gold:#FFC93C; --hot:#FF5D73;
  --good:#3FD685; --bad:#FF6B6E; --key:#4F3E0C; --keyink:#FFE49C;
  --onc:#090C12; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#090C12; --dot:#182033; --surface:#121824; --raised:#17202F; --sunk:#1D2638;
  --ink:#EEF2F9; --muted:#98A3BA; --line:#253049;
  --it:#7290FF; --biz:#FF9A52; --soton:#2BD3B8; --gold:#FFC93C; --hot:#FF5D73;
  --good:#3FD685; --bad:#FF6B6E; --key:#4F3E0C; --keyink:#FFE49C;
  --onc:#090C12; --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.55 var(--f-body);-webkit-text-size-adjust:100%;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:22px 22px;background-attachment:fixed}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--c,var(--it));outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;letter-spacing:-.02em}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:58px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.8rem;transform:rotate(-6deg);flex:none}
.logo b{font-family:var(--f-display);font-weight:800;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-weight:700;font-size:.78rem;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.streak{color:var(--hot)} .pill.xp{color:var(--gold)}
.sync{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.sync.on{background:var(--good)} .sync.busy{background:var(--gold)}
@media (max-width:420px){.logo b{display:none}}

/* home hero */
.hero{padding-block:30px 6px;display:grid;gap:18px}
.hero h1{font-size:clamp(2.3rem,8vw,3.6rem);font-weight:800}
.hero h1 .tag{background:var(--ink);color:var(--bg);padding:0 .18em;border-radius:.18em;display:inline-block;transform:rotate(-2deg)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;box-shadow:var(--shadow);min-width:0}
.stat b{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.stat.s-due b{color:var(--it)} .stat.s-streak b{color:var(--hot)} .stat.s-lvl b{color:var(--gold)}
.xpbar{display:block;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:3px}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}.stat.s-lvl{grid-column:1/-1}}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px}
@media (max-width:520px){.actions{grid-template-columns:1fr}}
.big-go{border:0;border-radius:var(--r);padding:18px 20px;text-align:left;background:var(--ink);color:var(--bg);display:grid;gap:2px;box-shadow:var(--shadow)}
.big-go b{font-family:var(--f-display);font-size:1.3rem;font-weight:800}
.big-go span{opacity:.7;font-size:.88rem}
.big-go[disabled]{opacity:.55;cursor:default}
.big-imp{border:2px dashed var(--muted);border-radius:var(--r);padding:16px 18px;background:transparent;text-align:left;display:grid;gap:2px}
.big-imp b{font-family:var(--f-display);font-size:1.15rem;font-weight:800}
.big-imp span{color:var(--muted);font-size:.85rem}
.big-imp:hover{border-color:var(--ink)}

/* courses & tiles */
.course{margin-top:40px}
.course-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.blob{width:18px;height:18px;border-radius:6px;background:var(--c);transform:rotate(12deg);flex:none}
.course-h h2{font-size:clamp(1.5rem,5vw,1.9rem);font-weight:800}
.course-sub{color:var(--muted);font-size:.85rem;flex-basis:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{position:relative;display:grid;gap:12px;align-content:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.code{font-family:var(--f-mono);font-weight:700;font-size:.74rem;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:8px;padding:4px 8px;white-space:nowrap}
.tile h3{font-size:1.18rem;font-weight:800}
.tile-foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted);font-size:.8rem}
.chip{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip.exam{border-color:var(--c);color:var(--c)}
.chip.new{background:var(--c);border-color:var(--c);color:var(--onc)}
.ring{--p:0;width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--sunk) 0)}
.ring b{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .tile{transition:transform .18s ease,box-shadow .18s ease}
  .tile:hover{transform:translateY(-3px);box-shadow:0 12px 30px color-mix(in srgb,var(--c) 25%,transparent)}
}

/* unit banner */
.banner{margin-top:18px;border-radius:calc(var(--r) + 4px);padding:24px 22px;color:var(--banner-ink);
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 52%,#000));display:flex;gap:16px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.banner::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:40px;background:rgb(255 255 255 / .09);transform:rotate(22deg)}
.banner .txt{flex:1;min-width:0;display:grid;gap:8px;position:relative;z-index:1}
.banner .eyebrow{color:rgb(255 255 255 / .8)}
.banner h1{font-size:clamp(1.7rem,6vw,2.5rem);font-weight:800}
.banner .chip{border-color:rgb(255 255 255 / .55);color:var(--banner-ink)}
.banner .ring{background:conic-gradient(#fff calc(var(--p)*1%),rgb(255 255 255 / .25) 0);width:68px;height:68px;position:relative;z-index:1}
.banner .ring b{width:54px;height:54px;background:color-mix(in srgb,var(--c) 60%,#000);color:#fff;font-size:.82rem}
.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-weight:700;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center;justify-content:center}
.tabs button[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--onc)}
.panel{margin-top:18px}

/* notes */
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow)}
.note h3{font-size:1.2rem;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.note h3 .n{font-family:var(--f-mono);font-size:.75rem;color:var(--c);font-weight:700}
.note ul{margin:0;padding-left:1.2em;display:grid;gap:7px}
.note li{max-width:70ch}
.note li::marker{color:var(--c)}
.kt{background:var(--key);color:var(--keyink);border-radius:5px;padding:0 4px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);border-radius:5px;padding:1px 5px}
.formula{list-style:none;margin-left:-1.2em;font-family:var(--f-mono);font-size:.9rem;background:color-mix(in srgb,var(--c) 10%,transparent);border-left:4px solid var(--c);padding:7px 12px;border-radius:0 8px 8px 0;overflow-x:auto}
.codeblock{list-style:none;margin-left:-1.2em;overflow-x:auto}
.codeblock pre{margin:0;font-family:var(--f-mono);font-size:.84rem;background:var(--sunk);border-radius:10px;padding:10px 12px;line-height:1.5}
.legend{font-size:.88rem;color:var(--muted);margin:0 0 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.packhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:26px 0 10px;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px dashed var(--c)}
.packhead b{font-family:var(--f-display);font-size:1.05rem}
.packhead p{margin:2px 0 0;color:var(--muted);font-size:.86rem;flex-basis:100%}
.tldr{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:14px 18px;margin-bottom:12px;font-size:1rem}
.tldr b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;margin-right:8px;color:var(--gold)}

/* buttons */
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;background:var(--c,var(--it));color:var(--onc)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn.danger{background:var(--bad);color:var(--onc)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}

/* flashcards */
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;flex:1}
.track i{display:block;height:100%;background:var(--c);border-radius:4px}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .3s ease}}
.flip{perspective:1400px;display:block;width:100%;border:0;background:none;padding:0;text-align:center}
.flip-inner{display:grid;transform-style:preserve-3d;position:relative}
@media (prefers-reduced-motion:no-preference){.flip-inner{transition:transform .55s cubic-bezier(.2,.8,.2,1)}}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:270px;border-radius:24px;padding:30px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;box-shadow:var(--shadow)}
.face.front{background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:var(--banner-ink)}
.face.front .big{font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,5vw,2rem);line-height:1.15}
.face.back{transform:rotateY(180deg);background:var(--surface);border:3px solid var(--c);font-size:1.12rem}
.face .side{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.face .from{font-family:var(--f-mono);font-size:.7rem;opacity:.8}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fc-actions button{border-radius:16px;padding:16px;font-weight:800;font-family:var(--f-display);font-size:1.1rem;border:0}
.again{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad)}
.gotit{background:var(--good);color:var(--onc)}
.hint{color:var(--muted);font-size:.86rem;text-align:center;margin:10px 0 0}
.done{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:30px 22px;text-align:center;display:grid;gap:12px;justify-items:center;box-shadow:var(--shadow)}
.done .big{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,12vw,4.5rem);color:var(--c);line-height:1;font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted)}

/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.q .stem{font-family:var(--f-display);font-size:clamp(1.2rem,4.5vw,1.45rem);font-weight:700;margin:12px 0 16px;line-height:1.25}
.combo{font-family:var(--f-mono);font-weight:700;font-size:.78rem;color:var(--hot)}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--raised);border:2px solid var(--line);border-radius:14px;padding:13px 14px}
.opt .k{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-family:var(--f-mono);font-weight:700;background:var(--sunk);color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.opt.right .k{background:var(--good);color:var(--onc)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt.wrong .k{background:var(--bad);color:var(--onc)}
.opt[disabled]{cursor:default}
@media (prefers-reduced-motion:no-preference){.opt.right{animation:pop .35s ease}.opt.wrong{animation:shake .35s ease}}
@keyframes pop{50%{transform:scale(1.025)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--sunk);font-size:.95rem}
.explain b{color:var(--good)} .explain b.x{color:var(--bad)}
.qnav{display:flex;justify-content:flex-end;margin-top:14px}
.pendbar{background:color-mix(in srgb,var(--gold) 18%,var(--surface));border:1px solid var(--gold);border-radius:12px;padding:10px 14px;font-weight:700}
.chip.areas{cursor:pointer;background:color-mix(in srgb,var(--hot) 14%,transparent);border-color:var(--hot);color:var(--hot);font-weight:700}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.subtabs button{flex:1;white-space:nowrap;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-weight:700;color:var(--muted)}
.subtabs button[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--onc)}
.subtabs .cnt{display:inline-block;min-width:20px;border-radius:999px;background:var(--hot);color:#fff;font-size:.75rem;padding:0 6px;margin-left:4px}
.topic{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--hot);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;display:grid;gap:10px;box-shadow:var(--shadow)}
.topic-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.topic h3{font-size:1.2rem}
.topic-stat{display:flex;gap:10px;align-items:center}
.wrongn{font-family:var(--f-mono);font-size:.78rem;font-weight:700;color:var(--hot)}
.dots{display:inline-flex;gap:4px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--sunk);border:1.5px solid var(--line)}.dots i.on{background:var(--good);border-color:var(--good)}
.learn summary{font-weight:700;cursor:pointer}.learn ul{margin:8px 0 0;padding-left:1.2em;display:grid;gap:6px}.learn li::marker{color:var(--c)}
.kc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:6px 12px;margin:8px 0 0}.kc dt{font-weight:700}.kc dd{margin:0;color:var(--muted)}
.pastlist{display:grid;gap:6px}.past{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:10px 12px;text-align:left}
.chip.good{border-color:var(--good);color:var(--good)}.chip.badc{border-color:var(--bad);color:var(--bad)}
.marks.full{background:var(--good)}.marks.zero{background:var(--bad)}
.fb{margin:0}.tip{margin:0;color:var(--muted)}
.youans{background:var(--raised);border-radius:10px;padding:10px 12px;margin-top:6px;white-space:normal}
.ms{list-style:none;padding-left:0!important}.ms li{padding-left:1.6em;position:relative}.ms li::before{content:"✗";position:absolute;left:0;color:var(--bad);font-weight:700}.ms li.hit::before{content:"✓";color:var(--good)}
.ms pre{margin:0;font-family:var(--f-mono);font-size:.84rem;white-space:pre-wrap}
.quizhub{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:12px}
.quizhub .done{align-content:start}
.done.mistakes{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.wronglist{margin:10px 0 0;padding-left:1.3em;display:grid;gap:10px}
.wronglist li{max-width:70ch}

/* exam */
.cmdwords{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:.9rem}
.cmdwords summary{font-weight:700;cursor:pointer}
.cmdwords dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:10px 0 0}
.cmdwords dt{font-family:var(--f-mono);font-weight:700;color:var(--c)}
.cmdwords dd{margin:0}
.eq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;display:grid;gap:10px;box-shadow:var(--shadow)}
.eq .qline{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.eq .qtext{font-weight:700;min-width:0}
.marks{font-family:var(--f-mono);font-size:.78rem;font-weight:700;white-space:nowrap;color:var(--onc);background:var(--c);border-radius:8px;padding:3px 8px}
textarea,input[type=text],select{width:100%;background:var(--raised);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.eq textarea{min-height:110px;resize:vertical}
.scheme{background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:12px;padding:12px 14px}
.scheme ul{margin:6px 0 0;padding-left:1.2em;display:grid;gap:4px}
.selfmark{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.selfmark button{min-width:36px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 8px;font-family:var(--f-mono);font-weight:700}
.selfmark button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--onc)}
.status{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}

/* import */
.imp-h{padding-block:28px 6px;display:grid;gap:8px}
.imp-h h1{font-size:clamp(2rem,7vw,3rem);font-weight:800}
.imp-h p{margin:0;color:var(--muted);max-width:60ch}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-top:14px;display:grid;gap:12px;box-shadow:var(--shadow)}
.step h2{font-size:1.15rem;display:flex;gap:10px;align-items:center}
.step h2 .num{width:28px;height:28px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem;flex:none}
.drop{border:2.5px dashed var(--line);border-radius:16px;padding:6px;background:var(--raised)}
.drop.over{border-color:var(--it);background:color-mix(in srgb,var(--it) 8%,var(--raised))}
.drop textarea{border:0;background:transparent;min-height:190px;resize:vertical}
.attach{display:flex;flex-wrap:wrap;gap:8px}
.att{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:10px;padding:5px 6px 5px 10px;font-size:.85rem;max-width:100%}
.att img{width:44px;height:30px;object-fit:cover;border-radius:5px}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.att button{border:0;background:var(--surface);border-radius:7px;width:26px;height:26px;flex:none}
.gen{display:grid;gap:10px;justify-items:start}
.spinner{display:flex;gap:10px;align-items:center;font-weight:700}
.spinner i{width:18px;height:18px;border-radius:50%;border:3px solid var(--sunk);border-top-color:var(--it);display:inline-block}
@media (prefers-reduced-motion:no-preference){.spinner i{animation:spin .8s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--bad);font-weight:700;margin:0}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.counts span{font-family:var(--f-mono);font-size:.78rem;font-weight:700;background:var(--sunk);border-radius:8px;padding:4px 9px}
label.lbl{font-weight:700;font-size:.9rem;display:grid;gap:6px}

.foot{margin-top:44px;color:var(--muted);font-size:.84rem;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
.toast{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:30;background:var(--gold);color:#1A1300;font-family:var(--f-mono);font-weight:700;border-radius:999px;padding:6px 12px;opacity:0;transform:translateY(-6px);pointer-events:none}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .2s,transform .2s}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
</style>

const COURSES = [
{id:"found",name:"Foundations · 3.1–3.2",color:"--it",full:"AQA A-level Business (7132): what businesses are, and how managers lead and decide",units:[
{id:"t31",code:"3.1",title:"What is Business?",assess:"Papers 1–3",exam:true,
notes:[
{h:"Why businesses exist",b:[
"A **mission** is the long-term purpose of a business; a **mission statement** communicates its values and aims to stakeholders.",
"**Objectives** turn the mission into targets, ideally **SMART**. Common objectives: profit, growth, survival, cash flow, social and ethical aims.",
"**Revenue** = price × quantity sold. **Total costs** = fixed costs + variable costs. **Profit** = revenue − total costs.",
"Profit is a reward for **risk-taking** and funds investment; a loss for too long means the business can't survive."]},
{h:"Forms of business",b:[
"**Sole traders** and **partnerships** usually have **unlimited liability**: owners are personally liable for debts.",
"**Private (Ltd)** and **public (plc)** limited companies have **limited liability** and are separate legal entities.",
"A plc can raise large sums by selling shares on the stock market, but risks **takeover** and pressure for **short-termism**.",
"**Social enterprises** trade to meet social or environmental aims and reinvest most profits.",
"**Ordinary share capital**: shareholders own the company, receive **dividends** and vote. **Market capitalisation** = share price × number of shares."]},
{h:"Shareholders vs stakeholders",b:[
"The **shareholder concept**: the business exists mainly to maximise returns to its owners.",
"The **stakeholder concept**: a business should consider the interests of everyone affected: employees, customers, suppliers, communities, government.",
"Stakeholder objectives often **conflict**, e.g. higher wages vs higher dividends."]},
{h:"The external environment",b:[
"**Competition**: more rivals means lower prices and margins, so firms differentiate or cut costs.",
"**Market conditions**: market growth, size and share affect demand and strategy.",
"**Incomes**: rising real incomes increase demand for normal and luxury goods.",
"**Interest rates**: higher rates raise borrowing costs and reduce consumer spending; they also tend to strengthen the pound.",
"**Demographic factors**: e.g. an ageing population changes what is demanded.",
"**Environmental issues and fair trade**: pressure for sustainable, ethical supply chains can raise costs but strengthen brand image."]}
],
cards:[
["Mission statement","A written summary of a business's long-term purpose and values"],["SMART","Specific, Measurable, Achievable, Realistic, Time-bound"],
["Unlimited liability","Owners are personally responsible for all business debts"],["Limited liability","Owners can only lose the money they invested"],
["Market capitalisation","Share price × number of shares issued"],["Dividend","A share of profit paid to shareholders"],
["Shareholder concept","The business should be run mainly to maximise returns for its owners"],["Stakeholder concept","The business should take account of everyone affected by its actions"],
["Social enterprise","A business with social or environmental aims that reinvests most of its profit"],["Profit","Revenue − total costs"],
["Effect of higher interest rates","Higher borrowing costs, lower consumer spending and a stronger pound"],["Short-termism","Focusing on quick results (e.g. this year's profit) at the expense of long-term success"]],
quiz:[
["Which type of business is most at risk of a hostile takeover?",["Sole trader","Partnership","Private limited company","Public limited company"],3,"Plc shares are traded publicly, so anyone can buy a controlling stake."],
["A firm has 20 million shares priced at £3.50. Market capitalisation?",["£5.7m","£23.5m","£70m","£350m"],2,"20m × £3.50 = £70m."],
["Which is the clearest example of the stakeholder concept?",["Maximising dividends","Paying the living wage despite lower profit","Cutting costs by offshoring","Share buy-backs"],1,"It balances employees' interests against owners'."],
["An increase in interest rates is most likely to…",["Increase demand for cars bought on credit","Reduce costs for firms with large loans","Reduce demand for luxury goods","Weaken the pound"],2,"Borrowing is dearer and households have less to spend."],
["A social enterprise mainly…",["Pays all profit to shareholders","Reinvests profit to meet social aims","Is owned by the government","Cannot make a profit"],1,"It trades like a business but for social or environmental goals."],
["Revenue £400k, fixed costs £150k, variable costs £180k. Profit?",["£70k","£220k","£250k","£730k"],0,"400 − (150 + 180) = £70k."],
["Which is NOT a feature of a private limited company?",["Limited liability","Shares sold on the stock exchange","Separate legal identity","Owned by shareholders"],1,"Ltd shares can't be offered to the general public."]],
exam:[
{q:"Explain one reason why a business might choose to become a public limited company.",m:4,cmd:"Explain",pts:["Identify: to raise large amounts of capital by selling shares to the public (1)","Application to a context, e.g. to fund expansion into new stores (1)","Analysis: no interest or repayments, unlike a loan, so cash flow is protected (1)","Further development: higher status/profile can help it borrow and attract staff (1)"]},
{q:"Analyse how an ageing UK population might affect a business that sells package holidays.",m:9,cmd:"Analyse",pts:["Larger market of retired people with time and, often, savings → opportunity for off-peak, longer and accessible holidays.","May need to change the marketing mix: product (adapted rooms, medical support), promotion (print and TV, not just social media), place (phone booking).","Costs may rise (accessibility adaptations, insurance), affecting margins.","Possible fall in the family/young adult segment over time → shift in target market.","Level 3 (7–9): developed chains of reasoning, well applied to package holidays."]},
{q:"Assess whether a business should focus on its shareholders or its wider stakeholders.",m:16,cmd:"Assess",pts:["Shareholder view: owners bear the risk; focus on returns secures investment and share price.","Stakeholder view: treating staff, suppliers and communities well builds loyalty, reputation and long-term profit.","Conflicts, e.g. pay rises vs dividends; environmental spending vs short-term profit.","Many argue the two converge in the long run (enlightened self-interest).","Depends on: ownership (plc vs family firm), competition, consumer attitudes, regulation.","Judgement required: e.g. a stakeholder approach usually serves shareholders best over the long term."]},
{q:"To what extent are profit objectives the most important objectives for a business?",m:25,cmd:"To what extent",pts:["Profit funds investment, rewards owners and signals success.","But survival and cash flow matter more for new or struggling firms.","Growth/market share may matter more for start-ups or plcs seeking scale.","Social enterprises and many firms put ethical or social aims first.","Objectives depend on ownership, stage of life cycle, market conditions and stakeholder pressure.","25-mark answers need balanced, well-applied arguments and a supported judgement on 'to what extent'."]}]
},
{id:"t32",code:"3.2",title:"Managers, Leadership & Decisions",assess:"Papers 1–3",exam:true,
notes:[
{h:"What managers do",b:[
"Managers **plan, organise, direct and control**: they set objectives, organise resources, lead people and monitor performance.",
"Influences on management style: the manager's personality, the task, the skills of the team, the time available and the culture."]},
{h:"Leadership styles",b:[
"**Tannenbaum–Schmidt continuum**: from **manager-centred** (tells) to **subordinate-centred** (delegates). Styles: tells, sells, consults, joins/delegates.",
"**Autocratic**: manager decides alone; quick but can demotivate. **Democratic**: staff contribute to decisions. **Paternalistic**: decides but in staff's interests. **Laissez-faire**: staff largely left to decide.",
"**Blake Mouton grid**: concern for **people** vs concern for **task**, each 1–9. Styles: impoverished (1,1), country club (1,9), produce or perish/authority-compliance (9,1), middle-of-the-road (5,5), **team leadership (9,9)**.",
"The best style depends on the situation, e.g. autocratic in a crisis, democratic with skilled staff."]},
{h:"Decision making",b:[
"**Scientific decision making**: set objectives → gather data → analyse → choose → implement → review. Reduces risk but takes time.",
"**Intuition** (hunch): fast and useful with little data or in fast-changing markets, but riskier and open to bias.",
"Influences: mission, objectives, ethics, external environment, resource constraints.",
"**Decision trees**: squares = decisions, circles = chance nodes. **Expected value** = Σ(probability × outcome). Subtract the cost to get the net gain.",
"Decision tree limits: probabilities and outcomes are estimates; ignores qualitative factors and risk attitude."]},
{h:"Stakeholders in decisions",b:[
"**Stakeholder mapping (Mendelow)** plots stakeholders by **power** and **interest**: manage closely (high, high), keep satisfied (high power), keep informed (high interest), monitor (low, low).",
"Stakeholder needs are considered through **consultation**, **communication**, and sometimes **compromise**."]}
],
cards:[
["Tannenbaum–Schmidt continuum","Leadership styles ranging from manager-centred (tells) to subordinate-centred (delegates)"],
["Blake Mouton: team leadership","High concern for people and high concern for task (9,9)"],["Blake Mouton: country club","High concern for people, low concern for task (1,9)"],
["Autocratic leadership","Manager makes decisions alone with little consultation"],["Paternalistic leadership","Manager decides, but with staff welfare in mind"],
["Laissez-faire leadership","Staff are left to make most decisions themselves"],["Expected value","Sum of (probability × outcome) for each possible outcome"],
["Decision tree: square","A decision point"],["Decision tree: circle","A chance node (uncertain outcomes)"],
["Scientific decision making","A logical, data-based process: objectives, data, analysis, decision, review"],
["Mendelow's matrix","Maps stakeholders by power and interest"],["High power, high interest stakeholders","Manage closely (key players)"]],
quiz:[
["On the Blake Mouton grid, high concern for task but low concern for people is…",["Country club","Impoverished","Produce or perish","Team leadership"],2,"(9,1): authority-compliance / produce or perish."],
["Which style is at the subordinate-centred end of the Tannenbaum–Schmidt continuum?",["Tells","Sells","Consults","Delegates"],3,"The manager lets the team decide within limits."],
["An option has a 0.6 chance of £100k and 0.4 chance of £40k. Expected value?",["£70k","£76k","£84k","£140k"],1,"0.6×100 + 0.4×40 = 60 + 16 = £76k."],
["Which situation best suits autocratic leadership?",["A team of expert software engineers","A fire evacuation","A creative design agency","A long-term strategy review"],1,"Fast, clear decisions are needed."],
["In Mendelow's matrix, high power but low interest stakeholders should be…",["Managed closely","Kept satisfied","Kept informed","Ignored"],1,"Keep satisfied so they don't use their power against you."],
["A weakness of decision trees is that…",["They show options clearly","Probabilities are estimates","They calculate expected values","They include costs"],1,"Results are only as good as the estimates used."],
["Intuitive decision making is most useful when…",["Lots of reliable data exists","The decision is reversible and must be quick","The decision is very expensive","Legal approval is needed"],1,"Hunches are quick where data is limited."]],
exam:[
{q:"Explain one advantage of using a decision tree when choosing between two investment options.",m:4,cmd:"Explain",pts:["Identify: sets out options, probabilities and outcomes clearly / gives a numerical expected value (1)","Application to the context (1)","Analysis: allows a logical comparison of risk and return, reducing the chance of a costly mistake (1)","Further analysis: forces managers to consider each possible outcome (1)"]},
{q:"Analyse the factors that might influence the leadership style of a restaurant manager.",m:9,cmd:"Analyse",pts:["Skills/experience of staff: inexperienced, young staff may need more direction.","Time pressure during busy service favours a more autocratic style.","Task: routine kitchen processes vs creative menu design.","Manager's personality and the firm's culture.","Labour turnover: high turnover makes delegation harder.","Level 3: developed, applied chains of reasoning."]},
{q:"Assess the usefulness of the Blake Mouton grid to a manager trying to improve team performance.",m:12,cmd:"Assess",pts:["Helps managers diagnose their own balance of people vs task focus.","Suggests 9,9 (team leadership) as the ideal, encouraging both high standards and good relationships.","But the best style may depend on the situation (contingency theory); 9,9 may not suit a crisis.","Self-assessment can be inaccurate; the grid simplifies complex behaviour.","Judgement: useful as a starting point, but must be applied flexibly."]},
{q:"To what extent should business decisions be based on data rather than intuition?",m:25,cmd:"To what extent",pts:["Data reduces risk, supports logical decisions and can be justified to stakeholders.","But data can be costly, slow, out of date or misleading (sampling, bias).","Intuition is fast, uses experience and suits new markets with no data.","Big data and analytics make data-driven decisions easier and cheaper.","Depends on the size and reversibility of the decision, time available, and manager experience.","A supported judgement: often a combination is best."]}]
}]},
{id:"func",name:"Functions · 3.3–3.6",color:"--biz",full:"Improving marketing, operations, finance and HR performance",units:[
{id:"t33",code:"3.3",title:"Marketing Performance",assess:"Papers 1–3",exam:true,
notes:[
{h:"Marketing objectives & research",b:[
"Marketing objectives: sales volume and value, **market size**, **market and sales growth**, **market share**, brand loyalty.",
"= Market share = firm's sales ÷ total market sales × 100",
"= Market growth = (new market size − old) ÷ old × 100",
"**Primary** research (surveys, focus groups) vs **secondary** (reports, ONS data). **Quantitative** (numbers) vs **qualitative** (opinions).",
"**Sampling**: random, quota, stratified. Bigger samples are more reliable but cost more."]},
{h:"Interpreting data",b:[
"**Correlation** shows a relationship between two variables (positive, negative, none); it doesn't prove cause.",
"**Confidence intervals**: a range within which the true value is likely to lie (e.g. 95% confident).",
"**Extrapolation** projects past trends forward; risky if conditions change.",
"**Price elasticity of demand (PED)**: how responsive demand is to a change in price.",
"= PED = % change in quantity demanded ÷ % change in price",
"PED > 1 (ignoring the sign) = **price elastic**: a price cut raises revenue. PED < 1 = **price inelastic**: a price rise raises revenue.",
"= YED = % change in quantity demanded ÷ % change in income",
"YED > 1: luxury good; 0–1: normal necessity; negative: **inferior good**."]},
{h:"Segmentation, targeting, positioning",b:[
"**Segmentation**: demographic, geographic, behavioural, psychographic. **Targeting**: niche vs mass.",
"**Positioning**: how the product is perceived vs rivals; a **positioning (perceptual) map** shows gaps.",
"**Competitive advantage**: a feature that lets the firm outperform rivals, e.g. lower costs or a strong brand (**USP**)."]},
{h:"The marketing mix",b:[
"**7Ps**: product, price, promotion, place, people, process, physical environment.",
"**Product life cycle**: development, introduction, growth, maturity, decline. **Extension strategies** delay decline.",
"**Boston Matrix**: stars, cash cows, question marks, dogs (market share vs market growth); used to balance a **product portfolio**.",
"Pricing: price skimming, penetration, cost-plus, competitive, dynamic, psychological; choice depends on PED, brand and competition.",
"Mix must be **integrated** and consistent with positioning."]}
],
cards:[
["PED formula","% change in quantity demanded ÷ % change in price"],["Price elastic","PED > 1 (ignoring the minus): demand changes proportionately more than price"],
["Price inelastic","PED < 1: a price rise increases revenue"],["YED formula","% change in quantity demanded ÷ % change in income"],
["Inferior good","Negative YED: demand falls as incomes rise"],["Market share","Firm's sales ÷ total market sales × 100"],
["Correlation","A relationship between two variables (doesn't prove cause)"],["Confidence interval","A range in which the true value is likely to lie, at a given confidence level"],
["Extrapolation","Using past trends to forecast the future"],["7Ps","Product, price, promotion, place, people, process, physical environment"],
["Cash cow","High market share in a low-growth market"],["Positioning map","Plots brands on two attributes to show where they sit versus rivals"]],
quiz:[
["Price rises 10% and quantity demanded falls 25%. PED?",["−0.4","−2.5","−15","−35"],1,"−25 ÷ 10 = −2.5 (price elastic)."],
["If PED is −0.3, a price increase will…",["Reduce revenue","Increase revenue","Leave revenue unchanged","Increase quantity sold"],1,"Inelastic: quantity falls proportionately less than price rises."],
["Incomes rise 4% and demand for a bus service falls 2%. The service is…",["A luxury","A normal necessity","An inferior good","Price elastic"],2,"YED = −0.5, which is negative."],

["Which pricing strategy suits a new product with few competitors and keen early adopters?",["Penetration","Skimming","Competitive","Loss leader"],1,"Charge high while demand is price inelastic."],
["Which is a 'P' added in the 7Ps for services?",["Packaging","Process","Profit","Partnership"],1,"People, process and physical environment."]],
exam:[
{q:"Explain how knowing the price elasticity of demand for its product could help a business set its price.",m:4,cmd:"Explain",pts:["Identify: PED shows how revenue will change with price (1)","If inelastic, raising price increases revenue (1)","If elastic, cutting price increases revenue/market share (1)","Application/limitation, e.g. PED estimates can change over time (1)"]},
{q:"Analyse the benefits to a clothing retailer of using a positioning map.",m:9,cmd:"Analyse",pts:["Identifies gaps in the market → opportunity for a new range with less competition.","Shows where rivals are crowded → avoid head-on competition.","Helps check brand perception vs intended positioning → guide marketing mix changes.","Supports targeting the right segment with consistent pricing and promotion.","Limitation: based on perceptions/two variables only."]},
{q:"Assess the value of the Boston Matrix to a business with a wide range of products.",m:16,cmd:"Assess",pts:["Shows balance of the portfolio; cash cows can fund stars and question marks.","Helps decide where to invest, harvest or divest.","Limitations: only two variables; market growth and share are hard to define; dogs can still be profitable or complement others.","A snapshot that doesn't show future potential; ignores links between products.","Judgement: useful planning tool combined with other analysis (e.g. product life cycle, finance)."]},
{q:"To what extent is market research the key to successful marketing decisions?",m:25,cmd:"To what extent",pts:["Research reduces risk, informs segmentation, targeting and the mix.","But it can be expensive, slow, biased or out of date; small samples are unreliable.","Consumers don't always do what they say; truly innovative products may lack research data.","Success also depends on creativity, finance, operations and timing.","Judgement on the extent, applied to context."]}]
},
{id:"t34",code:"3.4",title:"Operational Performance",assess:"Papers 1–3",exam:true,
notes:[
{h:"Operational objectives & measures",b:[
"Objectives: costs, quality, speed of response, flexibility, dependability, environmental targets, **added value**.",
"= Capacity utilisation = current output ÷ maximum possible output × 100",
"= Labour productivity = output per period ÷ number of employees",
"= Unit cost = total costs ÷ units of output"]},
{h:"Efficiency & capacity",b:[
"Improving efficiency: **lean production**, training, technology, better capital equipment.",
"**Lean production** cuts waste: **JIT**, **Kaizen** (continuous improvement), cell production.",
"Low capacity utilisation: high fixed cost per unit; solutions include rationalisation, subcontracting out, or finding new markets.",
"Very high utilisation (near 100%): no slack for repairs or extra orders; staff under pressure.",
"**Labour vs capital intensive**: choice depends on costs, scale, flexibility and quality needs."]},
{h:"Quality",b:[
"**Quality control** inspects output; **quality assurance** builds quality into every stage.",
"**TQM**: quality is everyone's responsibility, aiming for zero defects.",
"Benefits: fewer returns, stronger brand, can charge higher prices. Costs: training, checks, sometimes slower output.",
"Consequences of poor quality: waste, refunds, lost reputation."]},
{h:"Inventory & supply chains",b:[
"**Inventory control chart**: re-order level, **buffer stock**, lead time, maximum level.",
"**Just-in-time (JIT)**: stock arrives just as needed; cuts storage costs and waste but needs reliable suppliers.",
"Choosing suppliers: price, quality, reliability, flexibility, ethics and location.",
"**Outsourcing** cuts costs or adds expertise but reduces control."]}
],
cards:[
["Capacity utilisation","Current output ÷ maximum possible output × 100"],["Labour productivity","Output per period ÷ number of employees"],
["Unit cost","Total costs ÷ units of output"],["Lean production","Methods that cut waste in production, e.g. JIT and Kaizen"],
["Kaizen","Continuous improvement through small, regular changes suggested by staff"],["Just-in-time","Stock arrives exactly when it is needed, so little is held"],
["Buffer stock","The minimum stock kept to cover unexpected demand or delays"],["Lead time","Time between ordering stock and it arriving"],
["Quality assurance","Building quality into every stage of production"],["TQM","Total quality management: everyone responsible for quality"],
["Added value","Selling price − cost of bought-in materials"],["Effect of low capacity utilisation","Higher fixed cost per unit"]],
quiz:[
["A factory can make 50,000 units but makes 35,000. Capacity utilisation?",["35%","70%","143%","15%"],1,"35,000 ÷ 50,000 × 100 = 70%."],
["40 workers produce 6,000 units a week. Labour productivity?",["15","150","240","240,000"],1,"6,000 ÷ 40 = 150 units per worker per week."],
["Which is a disadvantage of JIT?",["Lower storage costs","Less waste","Dependence on reliable suppliers","Better cash flow"],2,"A late delivery can stop production."],
["Kaizen is best described as…",["Inspecting finished goods","Continuous small improvements","Outsourcing production","Holding high stock"],1,"Small, ongoing improvements from staff."],
["Which statement about quality assurance is correct?",["It only checks finished products","It builds quality in at every stage","It replaces training","It always raises unit costs"],1,"Prevention rather than detection."],
["Total costs £84,000 for 12,000 units. Unit cost?",["£0.14","£7","£70","£7,000"],1,"84,000 ÷ 12,000 = £7."],
["Rationalisation to raise capacity utilisation means…",["Increasing capacity","Reducing capacity","Raising prices","Hiring more staff"],1,"Cutting maximum capacity raises the % used."]],
exam:[
{q:"Explain one problem a business might face if it operates at close to 100% capacity utilisation.",m:4,cmd:"Explain",pts:["Identify: no spare capacity / machines can't be maintained / staff under pressure (1)","Application (1)","Analysis: may have to turn down orders, losing sales to rivals (1)","or breakdowns and errors raise costs and reduce quality (1)"]},
{q:"Analyse the benefits to a manufacturer of introducing just-in-time inventory management.",m:9,cmd:"Analyse",pts:["Lower storage and holding costs → improved margins.","Less cash tied up in inventory → better liquidity.","Less waste/obsolescence → supports lean production.","Faster response to customer requirements and product changes.","Requires reliable suppliers; benefits depend on supply chain."]},
{q:"Assess whether improving quality is the best way for a business to increase its competitiveness.",m:16,cmd:"Assess",pts:["Higher quality → reputation, loyalty, less price-sensitive demand, fewer returns.","But quality improvements may raise costs and prices in a price-sensitive market.","Alternatives: cutting costs, improving speed, flexibility, innovation, marketing.","Depends on the market (premium vs budget), competitors and customer priorities.","Judgement with justification."]},
{q:"To what extent is lean production the key to improving operational performance?",m:25,cmd:"To what extent",pts:["Lean cuts waste and costs, improves quality (Kaizen, TQM) and responsiveness (JIT).","Requires culture change, staff training and reliable suppliers; can be disrupted by supply shocks.","Other factors: technology, capacity management, location, workforce skills.","Suitability depends on the industry and scale.","Supported judgement."]}]

{id:"t35",code:"3.5",title:"Financial Performance",assess:"Papers 1–3",exam:true,
notes:[
{h:"Financial objectives",b:[
"Objectives include revenue, cost, profit (gross, operating, profit for the year), cash flow, **investment (capital expenditure)** levels and capital structure targets.",
"= Return on investment (ROI) = (return − cost of investment) ÷ cost of investment × 100",
"**Cash flow** is money moving in and out; a profitable firm can still fail if it runs out of cash."]},
{h:"Budgets",b:[
"Budgets: **income**, **expenditure** and **profit** budgets for a future period.",
"**Variance** = actual − budget. **Favourable (F)**: better than budget (more revenue or less cost). **Adverse (A)**: worse than budget.",
"Historical budgets use last year's figures; **zero-based budgets** start from nothing and justify every item.",
"Budgets help planning, control and motivation, but can be inflexible or based on poor forecasts."]},
{h:"Break-even & cash flow forecasts",b:[
"= Contribution per unit = selling price − variable cost per unit",
"= Break-even output = fixed costs ÷ contribution per unit",
"= Margin of safety = actual output − break-even output",
"= Profit = total contribution − fixed costs",
"**Cash flow forecasts** show expected inflows, outflows, net cash flow, opening and closing balances.",
"Improve cash flow: factoring, sale and leaseback, cutting inventory, chasing receivables, delaying payables, overdraft."]},
{h:"Sources of finance & improving profit",b:[
"**Internal**: retained profit, sale of assets. **External**: loans, share capital, venture capital, overdrafts, crowd funding.",
"Choice depends on cost, amount, time, control (shares dilute ownership) and risk (loans add gearing).",
"Improve profit: raise prices (if inelastic), cut costs, increase sales volume, change the product mix."]}
],
cards:[
["Variance","Actual figure − budgeted figure"],["Favourable variance","Actual better than budget: more revenue or lower costs"],
["Adverse variance","Actual worse than budget: less revenue or higher costs"],["Zero-based budgeting","Every item must be justified from zero each period"],
["Contribution per unit","Selling price − variable cost per unit"],["Break-even output","Fixed costs ÷ contribution per unit"],
["Margin of safety","Actual output − break-even output"],["ROI","(Return − cost of investment) ÷ cost × 100"],
["Factoring","Selling receivables to a factor for immediate cash, minus a fee"],["Sale and leaseback","Selling an asset then renting it back to release cash"],
["Venture capital","Investment in risky firms in return for a share of ownership"],["Profit vs cash","Profit is revenue minus costs; cash is money actually received and paid"]],
quiz:[
["Fixed costs £60,000; price £25; variable cost £10. Break-even?",["2,400","4,000","6,000","1,714"],1,"60,000 ÷ 15 = 4,000 units."],
["Budgeted revenue £50k, actual £46k. Variance?",["£4k F","£4k A","£46k A","£96k F"],1,"Less revenue than planned is adverse."],
["Budgeted costs £30k, actual £27k. Variance?",["£3k F","£3k A","£57k F","£27k A"],0,"Spending less than planned is favourable."],
["Sales 9,000 units, break-even 6,500. Margin of safety?",["2,500 units","15,500 units","6,500 units","1.38"],0,"9,000 − 6,500 = 2,500."],
["Which source of finance dilutes ownership?",["Bank loan","Retained profit","Share issue","Overdraft"],2,"New shareholders get votes and dividends."],
["An investment of £200k returns £260k. ROI?",["23%","30%","60%","130%"],1,"(260 − 200) ÷ 200 × 100 = 30%."],
["Which improves cash flow but not profit directly?",["Raising prices","Factoring receivables","Cutting wages","Selling more units"],1,"It speeds up cash; the fee actually reduces profit."]],
exam:[
{q:"Explain one limitation of break-even analysis.",m:4,cmd:"Explain",pts:["Identify, e.g. assumes all output is sold / constant price and costs / single product (1)","Application (1)","Analysis: in reality prices change with discounts and costs with bulk buying (1)","so the break-even point may be inaccurate and lead to poor decisions (1)"]},
{q:"Analyse why a profitable business might still experience cash flow problems.",m:9,cmd:"Analyse",pts:["Customers given long credit periods → cash arrives after costs are paid.","Holding high inventory ties up cash.","Large capital spending or loan repayments reduce cash but not profit.","Rapid growth (overtrading) → paying for inputs before sales receipts.","Seasonal sales patterns."]},
{q:"Assess the benefits of using budgets to manage a business's finances.",m:12,cmd:"Assess",pts:["Planning: forces managers to forecast and set targets.","Control: variances highlight problems early.","Motivation and delegation: managers own budgets.","Limitations: inflexible, based on estimates, can encourage overspending to 'use it'.","Judgement depends on accuracy of forecasts and how budgets are set (participation, zero-based)."]},
{q:"To what extent is improving cash flow more important than increasing profit for a small business?",m:25,cmd:"To what extent",pts:["Lack of cash causes most small business failures; it pays suppliers and staff.","Profit is needed for long-term survival, investment and attracting finance.","Short term vs long term: cash first, profit over time.","Depends on current liquidity, stage of growth, market conditions.","Supported judgement."]}]
},
{id:"t36",code:"3.6",title:"Human Resource Performance",assess:"Papers 1–3",exam:true,
notes:[
{h:"HR objectives & data",b:[
"Objectives: employee engagement and involvement, talent development, training, diversity, alignment of values, number, skills and location of employees.",
"= Labour turnover = number of staff leaving ÷ average number of staff × 100",
"= Labour retention = staff employed for the whole period ÷ staff at the start × 100",
"= Labour productivity = output per period ÷ number of employees",
"= Employee costs as % of turnover = employee costs ÷ revenue × 100",
"= Labour cost per unit = labour costs ÷ units of output"]},
{h:"Organisational design",b:[
"**Span of control**: staff directly reporting to one manager. **Levels of hierarchy**: tall vs flat structures.",
"**Delayering** removes management levels: cheaper and faster communication, but wider spans and fewer promotion routes.",
"**Centralisation** keeps decisions at the top; **decentralisation** delegates them closer to customers.",
"**Workforce planning** matches future staffing to needs: numbers, skills, location."]},
{h:"Motivation theories",b:[
"**Taylor** (scientific management): workers motivated by money; break jobs into simple tasks; piece rate.",
"**Maslow**: hierarchy of needs: physiological, safety, love/belonging, esteem, self-actualisation.",
"**Herzberg**: **hygiene factors** (pay, conditions) prevent dissatisfaction; **motivators** (achievement, recognition, responsibility) motivate.",
"**Hackman & Oldham**: job characteristics: skill variety, task identity, task significance, autonomy, feedback.",
"Financial methods: piece rate, commission, bonus, profit share, performance-related pay. Non-financial: job enrichment, rotation, empowerment, teamwork."]},
{h:"Employer–employee relations",b:[
"Employee representation: **trade unions**, **works councils**. Improve relations through communication, consultation and involvement.",
"Industrial action (strikes, work-to-rule) is costly for both sides; **ACAS** helps resolve disputes."]}
],
cards:[
["Labour turnover","Staff leaving ÷ average number of staff × 100"],["Labour retention","Staff staying the whole period ÷ staff at the start × 100"],
["Span of control","Number of staff directly reporting to one manager"],["Delayering","Removing layers of management from the hierarchy"],
["Decentralisation","Delegating decision-making power away from head office"],["Herzberg: hygiene factors","Pay, conditions, policies: prevent dissatisfaction but don't motivate"],
["Herzberg: motivators","Achievement, recognition, responsibility, the work itself, advancement"],["Maslow's top level","Self-actualisation: reaching your full potential"],
["Taylor","Scientific management: money motivates; simplify tasks; piece rate pay"],["Hackman & Oldham","Five job characteristics: skill variety, task identity, task significance, autonomy, feedback"],
["Job enrichment","Giving staff more responsible, challenging work (vertical loading)"],["Works council","A forum where managers and employee representatives discuss issues"]],
quiz:[
["12 staff leave a firm with an average of 80 employees. Labour turnover?",["6.7%","12%","15%","68%"],2,"12 ÷ 80 × 100 = 15%."],
["Which is a Herzberg motivator?",["Salary","Working conditions","Recognition","Company policy"],2,"The rest are hygiene factors."],
["Delayering usually results in…",["Narrower spans of control","Wider spans of control","More promotion routes","Taller structures"],1,"Fewer managers each manage more staff."],
["Which theorist would most support piece-rate pay?",["Maslow","Herzberg","Taylor","Hackman & Oldham"],2,"Taylor saw money as the main motivator."],
["Employee costs £1.2m, revenue £8m. Employee costs as % of turnover?",["6.7%","15%","66.7%","9.6%"],1,"1.2 ÷ 8 × 100 = 15%."],
["Which is NOT one of Hackman & Oldham's job characteristics?",["Autonomy","Feedback","Commission","Task significance"],2,"Commission is a financial incentive."],
["Decentralisation is most suitable when…",["Fast, consistent decisions are needed across all branches","Local managers understand local customers best","Managers lack skills","The firm is very small"],1,"Local knowledge improves decisions."]],
exam:[
{q:"Explain one reason why a business might want to reduce its labour turnover.",m:4,cmd:"Explain",pts:["Identify: cuts recruitment and training costs / retains skills (1)","Application (1)","Analysis: experienced staff are more productive and give better service (1)","so unit costs fall and customer satisfaction rises (1)"]},
{q:"Analyse how Herzberg's two-factor theory could help a retailer improve staff motivation.",m:9,cmd:"Analyse",pts:["Check hygiene factors first (fair pay, rotas, conditions) to remove dissatisfaction.","Then add motivators: recognition schemes, responsibility (team leader roles), training/progression.","Job enrichment rather than just pay rises.","Leads to lower labour turnover, better service and productivity.","Limitation: not all staff motivated the same way; costs of changes."]},
{q:"Assess the benefits of delayering for a large organisation.",m:16,cmd:"Assess",pts:["Lower costs (fewer managerial salaries).","Faster communication and decision making; closer to customers.","More empowerment and job enrichment for remaining staff.","But: wider spans, overworked managers, fewer promotion routes, morale effects of redundancies.","Judgement: depends on staff skills, culture and how it is implemented."]},
{q:"To what extent are financial incentives the most effective way to motivate employees?",m:25,cmd:"To what extent",pts:["Taylor: money motivates; commission/bonuses link pay to performance.","Herzberg: pay is a hygiene factor; Maslow: money meets lower needs only.","Non-financial methods (enrichment, empowerment, teamwork) may motivate longer term.","Depends on the job, the workforce and the culture; financial incentives can encourage short-termism or poor quality.","Supported judgement."]}]
}]},
{id:"strat",name:"Strategy · 3.7–3.10",color:"--soton",full:"Year 13 strategy: analysing position, choosing direction and methods, and managing change",units:[
{id:"t37",code:"3.7",title:"Analysing the Strategic Position",assess:"Papers 1–3",exam:true,
notes:[
{h:"Mission, objectives & SWOT",b:[
"Corporate objectives are set from the mission; strategies are the long-term plans to achieve them; tactics are short-term.",
"**SWOT**: internal strengths and weaknesses; external opportunities and threats.",
"**Kaplan & Norton's balanced scorecard**: financial, customer, internal process, learning and growth perspectives.",
"**Elkington's Triple Bottom Line**: profit, people, planet."]},
{h:"Financial ratios",b:[
"= ROCE = operating profit ÷ (total equity + non-current liabilities) × 100",
"= Current ratio = current assets ÷ current liabilities",
"= Gearing = non-current liabilities ÷ (total equity + non-current liabilities) × 100",
"= Inventory turnover = cost of sales ÷ average inventories held",
"= Receivables days = receivables ÷ revenue × 365",
"= Payables days = payables ÷ cost of sales × 365",
"Gearing over 50% is usually seen as **highly geared**: more risk when interest rates rise.",
"Ratios are more useful compared over time and against competitors; limits: historical, can be window-dressed, ignore qualitative factors."]},
{h:"The external environment",b:[
"**PESTLE**: political, economic, social, technological, legal, environmental.",
"Economic factors: GDP growth, inflation, exchange rates, interest rates, unemployment, globalisation.",
"**Porter's five forces**: competitive rivalry, threat of new entrants, threat of substitutes, buyer power, supplier power."]},
{h:"Investment appraisal",b:[
"**Payback period**: how long until the investment's cash inflows repay the cost.",
"= ARR = average annual profit ÷ initial investment × 100   (average profit = total net return ÷ years)",
"**Net present value (NPV)**: sum of discounted future cash flows − initial cost. Positive NPV = worthwhile.",
"Discount factors convert future cash into today's value, reflecting the time value of money.",
"Limits: forecasts are uncertain; non-financial factors (ethics, staff, strategy) matter too.",
"**Core competencies** (Prahalad & Hamel): capabilities that give access to many markets, add value and are hard to copy."]}
],
cards:[
["ROCE","Operating profit ÷ (total equity + non-current liabilities) × 100"],["Gearing","Non-current liabilities ÷ (total equity + non-current liabilities) × 100"],
["Current ratio","Current assets ÷ current liabilities"],["Inventory turnover","Cost of sales ÷ average inventories held"],
["Receivables days","Receivables ÷ revenue × 365"],["Payables days","Payables ÷ cost of sales × 365"],
["ARR","Average annual profit ÷ initial investment × 100"],["Payback period","Time taken for cash inflows to repay the initial investment"],
["NPV","Total discounted cash flows − initial investment"],["Porter's five forces","Rivalry, new entrants, substitutes, buyer power, supplier power"],
["Balanced scorecard","Financial, customer, internal process, learning and growth perspectives"],["Triple Bottom Line","Profit, people, planet"]],
quiz:[
["Operating profit £3m, total equity £15m, non-current liabilities £5m. ROCE?",["15%","20%","25%","60%"],0,"3 ÷ 20 × 100 = 15%."],
["Non-current liabilities £6m, total equity £9m. Gearing?",["40%","60%","66.7%","150%"],0,"6 ÷ 15 × 100 = 40%."],
["Receivables £50k, revenue £730k. Receivables days?",["14 days","25 days","50 days","73 days"],1,"50 ÷ 730 × 365 = 25 days."],

["Which of Porter's forces is strong when there are few suppliers of a key input?",["Buyer power","Supplier power","Threat of substitutes","Rivalry"],1,"Suppliers can push up prices."],

["Which is a limitation of ratio analysis?",["It allows comparison","It uses historical data","It highlights trends","It helps investors"],1,"Past results may not predict the future."]],
exam:[
{q:"Explain one reason why a highly geared business might be at risk if interest rates rise.",m:4,cmd:"Explain",pts:["Identify: much of its capital is loans, so interest payments rise (1)","Application (1)","Analysis: higher interest reduces profit for the year and cash (1)","may struggle to repay or raise new finance; less for dividends/investment (1)"]},
{q:"Analyse how Porter's five forces could help a new coffee shop chain decide whether to enter a market.",m:9,cmd:"Analyse",pts:["Rivalry: many established chains → price competition, low margins.","Threat of new entrants: low barriers → hard to sustain profits.","Substitutes: home coffee, other drinks.","Buyer power: customers can switch easily.","Supplier power: coffee bean prices and few large suppliers.","Overall: attractiveness of the market and need for differentiation."]},
{q:"Assess the usefulness of investment appraisal when a business is deciding whether to build a new factory.",m:16,cmd:"Assess",pts:["Payback shows risk/liquidity; ARR shows profitability; NPV allows for time value of money.","Gives a numerical, comparable basis for a big, long-term decision.","But: forecasts of cash flows and discount rates are uncertain over many years.","Ignores qualitative factors: location, staff, environment, strategy fit, ethics.","Judgement: useful but must be combined with qualitative analysis."]},
{q:"To what extent is ratio analysis the most useful way to assess a business's strategic position?",m:25,cmd:"To what extent",pts:["Ratios show profitability, liquidity, efficiency and gearing; useful for trends and comparisons.","Limitations: historical, window dressing, need context and benchmarks.","Other tools: SWOT, PESTLE, five forces, balanced scorecard, core competencies, Triple Bottom Line.","Non-financial factors (brand, staff, innovation) matter for strategy.","Supported judgement."]}]
},
{id:"t38",code:"3.8",title:"Choosing Strategic Direction",assess:"Papers 1–3",exam:true,
notes:[
{h:"Ansoff's matrix",b:[
"**Market penetration**: existing products, existing markets (lowest risk).",
"**Product development**: new products, existing markets.",
"**Market development**: existing products, new markets.",
"**Diversification**: new products, new markets (highest risk).",
"The choice depends on objectives, resources, competition, risk appetite and the market's potential."]},
{h:"Strategic positioning",b:[
"**Porter's generic strategies**: **cost leadership**, **differentiation**, and **focus** (cost focus or differentiation focus) on a niche.",
"Being 'stuck in the middle' (neither lowest cost nor clearly different) risks low returns.",
"**Bowman's strategic clock**: positions based on price and perceived added value, e.g. low price, hybrid, differentiation, focused differentiation; positions 6–8 (higher price, same or lower value) usually fail.",
"Competitive advantage must be **sustainable**: hard to copy, valued by customers."]},
{h:"Influences on the choice",b:[
"Strengths and weaknesses (SWOT), core competencies, financial position, the external environment and competitors' actions.",
"The value of having a competitive advantage: higher margins, customer loyalty, resilience to threats."]}
],
cards:[
["Market penetration","Selling more of existing products in existing markets"],["Product development","New products for existing markets"],
["Market development","Existing products in new markets"],["Diversification","New products in new markets (highest risk)"],
["Cost leadership","Being the lowest-cost producer in the industry"],["Differentiation strategy","Offering something unique that customers will pay more for"],
["Focus strategy","Targeting a niche with low cost or differentiation"],["Stuck in the middle","Neither lowest cost nor clearly differentiated"],
["Bowman's strategic clock","Positions products by price and perceived added value"],["Hybrid strategy (Bowman)","Low price with high perceived added value"],
["Sustainable competitive advantage","An advantage that rivals find hard to copy over time"]],

exam:[

{q:"Analyse how Bowman's strategic clock could help a hotel chain choose its positioning.",m:9,cmd:"Analyse",pts:["Shows options based on price and perceived added value.","Hybrid: good value at moderate prices, attracting price-conscious travellers.","Differentiation: luxury features justify higher prices.","Identifies failure positions to avoid (high price, low value).","Must match the chain's resources and target market."]},
{q:"Assess whether market development or product development is the better growth strategy for a successful UK sportswear brand.",m:16,cmd:"Assess",pts:["Market development: use proven products and brand abroad; risks: cultural differences, competition, exchange rates.","Product development: use existing UK customer base and brand loyalty; risks: R&D cost, product failure.","Depends on: brand strength abroad, competition, resources, saturation of the UK market.","Judgement with justification."]},
{q:"To what extent is a cost leadership strategy the best way for a business to gain a competitive advantage?",m:25,cmd:"To what extent",pts:["Cost leadership allows lowest prices or higher margins; strong in price-sensitive markets.","Requires scale, efficiency; only one firm can be cost leader; price wars risk.","Differentiation can build loyalty and less price-sensitive demand.","Focus strategies suit smaller firms.","Depends on market, resources and rivals; supported judgement."]}]
},
{id:"t39",code:"3.9",title:"Strategic Methods",assess:"Papers 1–3",exam:true,
notes:[
{h:"Growth and its problems",b:[
"**Organic growth**: internal, e.g. opening new stores. Slower, lower risk, keeps control and culture.",
"**External (inorganic) growth**: **mergers** and **takeovers**. Faster but costly; culture clashes and integration problems.",
"Integration: **horizontal** (same stage), **vertical backward** (towards suppliers), **vertical forward** (towards customers), **conglomerate** (unrelated).",
"**Economies of scale** lower unit costs as output rises (purchasing, technical, financial, managerial). **Diseconomies of scale**: coordination, communication, motivation problems.",
"**Synergy**: combined firm worth more than the parts. **Overtrading**: growing too fast for cash. **Greiner's model**: growth phases each ending in a crisis.",
"**Retrenchment**: cutting back the scale of operations."]},
{h:"Innovation",b:[
"Innovation: new products or processes. Gains: competitive advantage, higher prices. Risks: cost, failure.",
"Ways to innovate: **Kaizen**, **R&D**, **intrapreneurship**, **benchmarking**.",
"Protect innovation with **intellectual property**: patents, copyright, trademarks."]},
{h:"Internationalisation",b:[
"Reasons: new markets, lower costs, spread risk. Methods: exporting, licensing, alliances, direct investment.",
"Factors in choosing a country: market size, costs, political stability, infrastructure, exchange rates.",
"**Bartlett & Ghoshal**: **international** (low local responsiveness, low global integration), **multidomestic** (high local responsiveness), **global** (high integration), **transnational** (high both).",
"**Offshoring** moves operations abroad; **reshoring** brings them back."]},
{h:"Digital technology",b:[
"**E-commerce**: wider reach, lower costs, 24/7 sales; more competition and price transparency.",
"**Big data** and **data mining**: find patterns in large data sets to target customers and forecast demand.",
"**ERP (enterprise resource planning)**: integrated software linking functions (stock, finance, HR, sales).",
"Issues: cost, data security, staff training, resistance to change."]}
],
cards:[
["Organic growth","Growth from within, e.g. new stores or products"],["Horizontal integration","Joining with a firm at the same stage of production"],
["Backward vertical integration","Joining with a supplier"],["Forward vertical integration","Joining with a customer, e.g. a retailer"],
["Conglomerate integration","Joining with a business in an unrelated market"],["Economies of scale","Lower unit costs as output increases"],
["Diseconomies of scale","Higher unit costs from being too large, e.g. communication problems"],["Synergy","The combined business is worth more than the separate parts"],
["Overtrading","Expanding too fast without enough working capital"],["Transnational strategy","High global integration and high local responsiveness"],
["ERP","Enterprise resource planning: software linking all business functions"],["Big data","Very large data sets analysed to reveal patterns and trends"]],
quiz:[

["A car maker buys a tyre manufacturer. This is…",["Forward vertical","Backward vertical","Horizontal","Conglomerate"],1,"Moving towards a supplier."],
["Which is a diseconomy of scale?",["Bulk buying discounts","Cheaper finance","Poor communication","Specialist managers"],2,"Large size can slow communication."],
["Bartlett & Ghoshal: high local responsiveness, low global integration is…",["International","Multidomestic","Global","Transnational"],1,"Products are adapted for each country."],
["Overtrading is most likely to cause…",["Cash flow problems","Diseconomies of scale","Lower gearing","Higher retained profit"],0,"Growth outpaces available cash."],
["Which describes Greiner's model?",["Five forces in a market","Growth phases ending in crises","Leadership grid","Product portfolio matrix"],1,"Each phase of growth leads to a crisis needing a new structure."]],
exam:[
{q:"Explain one benefit to a business of growing organically rather than by takeover.",m:4,cmd:"Explain",pts:["Identify: lower risk / keeps control / avoids culture clash (1)","Application (1)","Analysis: growth can be funded gradually from retained profit (1)","avoiding the large cost and integration problems of a takeover (1)"]},
{q:"Analyse the potential benefits to a supermarket of using big data.",m:9,cmd:"Analyse",pts:["Loyalty card data → targeted offers → higher sales and loyalty.","Better forecasting of demand → less waste, better inventory management.","Identifying trends → product development and pricing decisions.","Store layout and location decisions.","Costs/risks: data security, GDPR, analysis skills."]},
{q:"Assess the case for a UK manufacturer offshoring its production to Asia.",m:16,cmd:"Assess",pts:["Lower labour and possibly land costs → lower unit costs, competitiveness.","Closer to Asian markets and suppliers.","Risks: quality control, longer supply chains, exchange rate and political risk, ethical concerns, 'Made in UK' brand loss.","Reshoring trend due to supply chain disruption and automation.","Judgement depending on product type and market."]},
{q:"To what extent is growth by takeover likely to be successful for a business?",m:25,cmd:"To what extent",pts:["Fast growth, market share, economies of scale, synergies, new skills/brands.","Many takeovers fail to add value: overpaying, culture clashes, integration problems, diseconomies of scale.","Success depends on fit, due diligence, management, how integration and change are handled.","Organic growth as an alternative.","Supported judgement."]}]

{id:"t310",code:"3.10",title:"Managing Strategic Change",assess:"Papers 1–3",exam:true,
notes:[
{h:"Causes & resistance",b:[
"Causes of change: internal (new leadership, growth, poor performance) and external (PESTLE, competitors, technology).",
"**Kotter & Schlesinger**: reasons for resistance: **self-interest**, **misunderstanding and lack of trust**, **different assessments**, **low tolerance of change**.",
"Ways to overcome resistance: **education and communication**, **participation and involvement**, **facilitation and support**, **negotiation and agreement**, **manipulation and co-option**, **explicit and implicit coercion**.",
"**Lewin's force field analysis**: driving forces vs restraining forces; change happens when driving forces outweigh restraining ones. Weight the forces to decide."]},
{h:"Organisational culture",b:[
"Culture = 'the way we do things around here': values, norms, attitudes.",
"**Handy's cultures**: **power** (one central figure), **role** (rules and procedures), **task** (project teams), **person** (individuals with expertise).",
"**Hofstede's national cultures**: power distance, individualism, masculinity, uncertainty avoidance, long-term orientation, indulgence.",
"Changing culture is difficult and slow; it often needs new leadership, structures and reward systems."]},
{h:"Implementing strategy",b:[
"Successful implementation needs leadership, communication, the right organisational structure and resources.",
"**Network analysis (critical path)**: nodes show earliest start time (EST) and latest finish time (LFT). The **critical path** has activities with zero float.",
"= Total float = LFT − duration − EST",
"Network analysis helps plan resources and spot delays, but relies on accurate time estimates."]},
{h:"Problems with strategy",b:[
"Why strategies fail: poor planning, poor implementation, resistance, changing environment, lack of resources.",
"**Planned vs emergent strategy**: deliberate long-term plans vs strategies that develop in response to events.",
"**Contingency planning** prepares for crises; **scenario planning** considers different futures."]}
],

function merge(a,b){
  const out={cards:{},quiz:{},exam:{},wrong:{},topics:{},tests:{},days:{},updated:Math.max(a.updated||0,b.updated||0)};
  for(const k of ["cards","exam","wrong","topics","tests"]){
    const A=a[k]||{},B=b[k]||{};
    new Set([...Object.keys(A),...Object.keys(B)]).forEach(id=>{const x=A[id],y=B[id];out[k][id]=!x?y:!y?x:((y.t||0)>(x.t||0)?y:x)});
  }
  const QA=a.quiz||{},QB=b.quiz||{};
  new Set([...Object.keys(QA),...Object.keys(QB)]).forEach(id=>{
    const x=QA[id]||{},y=QB[id]||{},later=(y.t||0)>(x.t||0)?y:x;
    out.quiz[id]={best:Math.max(x.best||0,y.best||0),last:later.last,n:Math.max(x.n||0,y.n||0),t:later.t||0}});
  const DA=a.days||{},DB_=b.days||{};
  new Set([...Object.keys(DA),...Object.keys(DB_)]).forEach(d=>out.days[d]=Math.max(DA[d]||0,DB_[d]||0));
  const GA=a.gone||{},GB=b.gone||{};out.gone=Object.assign({},GA);for(const k in GB)out.gone[k]=Math.max(GA[k]||0,GB[k]||0);
  return out;
}

async function flush(){
  if(!docRef||writing||!dirty) return;
  writing=true; dirty=false;
  try{await docRef.set(JSON.parse(JSON.stringify(P)));setSync("on","Synced to your account")}
  catch(e){if(e&&e.code==="unavailable"){dirty=true;setTimeout(flush,1500+Math.random()*1500)}else setSync("","Not synced — saved on this device")}
  writing=false; if(dirty) flush();
}
